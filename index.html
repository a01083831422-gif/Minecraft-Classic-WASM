    height: 16px;

    z-index: 10;

  }

    left: 7px;
    top: 1px;
    width: 2px;
    height: 14px;
  }
  #crosshair::after {
    top: 7px;
    left: 1px;
    height: 2px;
    width: 14px;
  }

    align-items: center;

async function loadWasmInstance() {
  try {
    const response = await fetch("minecraft.wasm");
    if (response.ok) {
      const bytes = await response.arrayBuffer();
      const res = await WebAssembly.instantiate(bytes, {});
      return res.instance;
    }
  } catch (e) {}
  const bin = Uint8Array.from(atob(FALLBACK_WASM), c => c.charCodeAt(0));
  const res = await WebAssembly.instantiate(bin, {});
  return res.instance;
}

loadWasmInstance().then(instance => {
  const rd = instance.exports;
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const pauseOverlay = document.getElementById("pause-overlay");
  const fpsLine = document.getElementById("fps-line");
  const blockLabel = document.getElementById("selected-block");

  const seed = (Math.random() * 1e9) | 0;
  rd.init(seed, 1, 48);

  const scale = 3;
  function resize() {
    canvas.width = Math.min(1280, Math.max(32, Math.floor(innerWidth / scale)));
    canvas.height = Math.min(800, Math.max(24, Math.floor(innerHeight / scale)));
  }
  addEventListener("resize", resize);
  resize();

  // Verrouillage de la souris
  pauseOverlay.addEventListener("click", () => {
    canvas.requestPointerLock();
  });

  canvas.addEventListener("click", () => {
    if (document.pointerLockElement !== canvas) {
      canvas.requestPointerLock();
    }
  });

  document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement === canvas) {
      pauseOverlay.classList.add("hidden");
    } else {
      pauseOverlay.classList.remove("hidden");
    }
  });

  const blockNames = ["Air", "Pierre", "Herbe", "Terre", "Pavé", "Bois", "Bûche", "Feuilles"];
  function updateBlockLabel(id) {
    if (blockNames[id]) {
      blockLabel.textContent = `Bloc : ${blockNames[id]} [${id}]`;
    }
  }

  const keys = new Set();
  addEventListener("keydown", e => {
    keys.add(e.code);

    let num = -1;
    if (e.code.startsWith("Digit")) {
      num = +e.code.slice(5);
    } else if (e.code.startsWith("Numpad")) {
      num = +e.code.slice(6);
    }
    if (num >= 1 && num <= 7) {
      rd.action(0, 0, num, 0);
      updateBlockLabel(num);
    }

    if (e.code === "KeyR") rd.action(0, 0, 0, 1);
    if (e.code === "Space") e.preventDefault();
  });

  addEventListener("keyup", e => keys.delete(e.code));
  addEventListener("blur", () => keys.clear());

  let dragged = 0;
  canvas.addEventListener("mousemove", e => {
    if (document.pointerLockElement === canvas || (e.buttons & 1)) {
      rd.turn(e.movementX * 0.0035, -e.movementY * 0.0035);
      dragged += Math.abs(e.movementX) + Math.abs(e.movementY);
    }
  });

  canvas.addEventListener("mousedown", e => {
    dragged = 0;
    if (document.pointerLockElement !== canvas) return;
    if (e.button === 0) rd.action(1, 0, 0, 0); // Creuser
    if (e.button === 2) rd.action(0, 1, 0, 0); // Poser
  });

  canvas.addEventListener("mouseup", e => {
    if (document.pointerLockElement !== canvas && e.button === 0 && dragged < 4) {
      rd.action(1, 0, 0, 0);
    }
  });

  canvas.addEventListener("contextmenu", e => e.preventDefault());

  canvas.addEventListener("wheel", e => {
    let s = rd.selected() + (e.deltaY > 0 ? 1 : -1);
    if (s < 1) s = 7;
    if (s > 7) s = 1;
    rd.action(0, 0, s, 0);
    updateBlockLabel(s);
  }, { passive: true });

  // Favicon 32x32 dynamique
  const fav = document.createElement("canvas");
  fav.width = fav.height = 32;
  const favCtx = fav.getContext("2d");
  const favLink = document.getElementById("favicon");

  let last = performance.now(), acc = 0, frames = 0, fpsT = last, favT = 0;

  function draw(w, h) {
    const ptr = rd.render(w, h);
    ctx.putImageData(new ImageData(new Uint8ClampedArray(rd.memory.buffer, ptr, w * h * 4), w, h), 0, 0);
  }

  function frame(now) {
    acc += Math.min(250, now - last);
    last = now;

    // Déplacement ZQSD + WASD + Flèches
    const fwd = (keys.has("KeyW") || keys.has("KeyZ") || keys.has("ArrowUp")) ? 1 : 0;
    const back = (keys.has("KeyS") || keys.has("ArrowDown")) ? 1 : 0;
    const left = (keys.has("KeyA") || keys.has("KeyQ") || keys.has("ArrowLeft")) ? 1 : 0;
    const right = (keys.has("KeyD") || keys.has("ArrowRight")) ? 1 : 0;
    const jump = keys.has("Space") ? 1 : 0;

    rd.set_input(fwd - back, right - left, jump);

    while (acc >= 1000 / 60) {
      rd.tick();
      acc -= 1000 / 60;
    }

    const w = canvas.width, h = canvas.height;
    draw(w, h);

    if (now - favT > 300) {
      favT = now;
      const fp = rd.render(32, 32);
      favCtx.putImageData(new ImageData(new Uint8ClampedArray(rd.memory.buffer, fp, 32 * 32 * 4).slice(), 32, 32), 0, 0);
      favLink.href = fav.toDataURL();
    }

    frames++;
    if (now - fpsT > 1000) {
      fpsLine.textContent = `${frames} fps, 0 chunk updates`;
      fpsT = now;
      frames = 0;
    }

    requestAnimationFrame(frame);
  }

  updateBlockLabel(rd.selected());
  requestAnimationFrame(frame);
}).catch(err => {
  console.error(err);
});
</script>
